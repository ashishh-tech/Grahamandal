<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2B2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C59820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C047"/>
      <stop offset="50%" stop-color="#C59820"/>
      <stop offset="100%" stop-color="#785A00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FAF8F5"/>
  <circle cx="32" cy="32" r="28" fill="url(#goldGlow)"/>
  <!-- Planetary Orbit Ring -->
  <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-25 32 32)"/>
  <!-- Planet dot on orbit -->
  <circle cx="53" cy="22" r="2.5" fill="#0D9488"/>
  <!-- Inner seal border -->
  <circle cx="32" cy="32" r="22" fill="#C59820" stroke="#785A00" stroke-width="1"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#FAF8F5" stroke-opacity="0.4" stroke-width="0.8"/>
  <!-- Sanskrit Character 'ग्रह' -->
  <text x="32" y="38" font-family="'Noto Serif', 'Noto Sans Devanagari', serif" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">ग्रह</text>
</svg>
